name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        working-directory: windows
        run: python -m PyInstaller --noconfirm freeple_cleaner.spec

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp windows/dist/FreepleCleaner.exe dist/FreepleCleaner-Windows.exe
          ls -lh dist/FreepleCleaner-Windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreepleCleaner-Windows
          path: dist/FreepleCleaner-Windows.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FreepleCleaner-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
